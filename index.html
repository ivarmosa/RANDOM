<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusChat | منصة المراسلة الموحدة</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            cyan: '#00ffff',
                            dark: '#020202',
                            card: '#0a0a0c',
                            border: 'rgba(255, 255, 255, 0.08)'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: #020202; 
            color: #ffffff; 
            margin: 0; 
            overflow-x: hidden; 
            min-height: 100vh; 
        }
        .glass { 
            background: rgba(255, 255, 255, 0.02); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.07); 
        }
        .glass-card { 
            background: rgba(12, 12, 15, 0.7); 
            backdrop-filter: blur(24px); 
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.09); 
        }
        .neon-cyan { 
            color: #00ffff; 
            text-shadow: 0 0 12px rgba(0, 255, 255, 0.45); 
        }
        .neon-glow { 
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.12); 
        }
        .neon-glow-hover:hover {
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.25);
        }
        
        input, textarea { 
            background: rgba(255, 255, 255, 0.04) !important; 
            border: 1px solid rgba(255, 255, 255, 0.1) !important; 
            color: #ffffff !important; 
            outline: none; 
            transition: all 0.3s ease;
        }
        input:focus, textarea:focus { 
            border-color: #00ffff !important; 
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.25); 
        }
        
        #snow-canvas { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 0; 
            pointer-events: none; 
        }
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(0, 255, 255, 0.3); border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: rgba(0, 255, 255, 0.6); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.25s ease-out forwards;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen relative selection:bg-cyan-500 selection:text-black">

    <!-- خلفية الثلج المتساقط -->
    <canvas id="snow-canvas"></canvas>

    <!-- نظام التنبيهات المخصص (Notification Toast) -->
    <div id="toast-container" class="fixed top-5 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2 w-11/12 max-w-sm pointer-events-none"></div>

    <!-- نافذة التأكيد المخصصة (Custom Confirmation Modal) -->
    <div id="confirm-modal" class="fixed inset-0 z-[110] bg-black/80 backdrop-blur-md flex items-center justify-center p-4 hidden">
        <div class="glass-card max-w-sm w-full p-6 rounded-2xl text-center space-y-4 animate-fade-in border border-white/10">
            <div class="w-12 h-12 rounded-full bg-cyan-500/10 border border-cyan-400/30 text-cyan-400 flex items-center justify-center mx-auto">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
            </div>
            <h3 id="confirm-title" class="text-base font-bold text-white">تأكيد الإجراء</h3>
            <p id="confirm-message" class="text-xs text-gray-300 leading-relaxed"></p>
            <div class="flex gap-3 pt-2">
                <button id="confirm-yes-btn" class="flex-1 bg-cyan-500 hover:bg-cyan-400 text-black font-bold py-2.5 rounded-xl text-xs transition">تأكيد</button>
                <button id="confirm-no-btn" class="flex-1 bg-white/10 hover:bg-white/20 text-gray-300 font-semibold py-2.5 rounded-xl text-xs transition">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- شريط العنونة والمؤقت -->
    <nav class="glass sticky top-0 p-4 z-50 flex justify-between items-center px-4 md:px-8 border-b border-white/10">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 rounded-full bg-cyan-400 animate-pulse"></div>
            <h1 class="text-xl md:text-2xl font-black tracking-wider neon-cyan">NexusChat</h1>
            <span class="text-[10px] bg-cyan-500/10 text-cyan-400 px-2.5 py-0.5 rounded-full border border-cyan-500/20 hidden sm:inline-block font-mono">
                مشفّر آمن
            </span>
        </div>
        
        <div id="session-info" class="hidden flex items-center gap-3 md:gap-4">
            <div class="flex items-center gap-2 bg-black/50 px-3 py-1.5 rounded-xl border border-white/10">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span id="display-username" class="text-xs font-bold text-gray-100"></span>
                <span id="display-server-tag" class="text-[10px] bg-cyan-500/20 text-cyan-300 px-2 py-0.5 rounded-md font-mono border border-cyan-500/30"></span>
            </div>
            
            <div class="flex items-center gap-2 bg-red-500/10 border border-red-500/20 px-3 py-1.5 rounded-xl">
                <span class="text-[11px] text-red-400 font-medium hidden sm:inline">الوقت المتبقي:</span>
                <span id="timer-display" class="font-mono text-xs font-bold text-red-400">30:00</span>
            </div>

            <button onclick="requestEndSession()" class="text-xs text-red-400 hover:text-red-300 hover:bg-red-500/20 transition bg-red-500/10 px-3 py-1.5 rounded-xl border border-red-500/20">
                إنهاء
            </button>
        </div>
    </nav>

    <main class="flex-1 container mx-auto px-4 py-8 max-w-4xl relative z-10 flex flex-col justify-center">

        <!-- شاشة تسجيل الدخول -->
        <div id="login-screen" class="glass-card p-8 rounded-3xl max-w-md mx-auto w-full text-center neon-glow">
            <div class="w-16 h-16 bg-cyan-500/10 border border-cyan-400/30 rounded-2xl flex items-center justify-center mx-auto mb-4 text-cyan-400">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457-.39-2.823-1.07-4"></path></svg>
            </div>
            <h2 class="text-2xl font-black mb-2">دخول المحطة الموحدة</h2>
            <p class="text-xs text-gray-400 mb-6 leading-relaxed">أدخل اسمك المستعار لربطك تلقائياً بخط اتصال مشفر لمدة 30 دقيقة عبر القناة الموحدة.</p>

            <div class="space-y-4">
                <input type="text" id="input-username" placeholder="اكتب الاسم المستعار هنا..." class="w-full p-4 rounded-xl text-center font-bold text-sm tracking-wide">
                <button onclick="startSession()" class="w-full bg-cyan-500 hover:bg-cyan-400 text-black font-bold py-4 rounded-xl transition shadow-lg shadow-cyan-500/20 active:scale-[0.99]">
                    دخول تلقائي للمحطة
                </button>
            </div>
        </div>

        <!-- شاشة المراسلة الموحدة -->
        <div id="chat-screen" class="hidden glass-card rounded-3xl p-4 md:p-6 flex flex-col h-[78vh] neon-glow">
            <!-- رأس المحادثة -->
            <div class="flex justify-between items-center pb-3 border-b border-white/10">
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-ping"></span>
                    <span class="text-xs md:text-sm font-bold text-gray-200">القناة الموحدة للمراسلة</span>
                </div>
                <button onclick="requestClearChat()" class="text-xs text-gray-400 hover:text-red-400 transition flex items-center gap-1 bg-white/5 hover:bg-white/10 px-3 py-1.5 rounded-xl border border-white/5">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    <span>مسح الشاشة</span>
                </button>
            </div>

            <!-- منطقة الرسائل -->
            <div id="messages-box" class="flex-1 overflow-y-auto custom-scroll my-4 space-y-3 px-1">
                <div class="text-center my-4">
                    <span class="text-[10px] bg-cyan-500/10 border border-cyan-500/20 text-cyan-300 px-3 py-1 rounded-full font-mono">
                        تم الاتصال بنجاح. القناة موحدة ومحمية بالتشفير.
                    </span>
                </div>
            </div>

            <!-- مربع إدخال الرسالة -->
            <div class="pt-2 border-t border-white/5">
                <div class="flex gap-2">
                    <input type="text" id="input-message" onkeydown="if(event.key==='Enter') sendMessage()" placeholder="اكتب رسالتك هنا..." class="flex-1 p-3.5 rounded-xl text-xs md:text-sm">
                    <button onclick="sendMessage()" class="bg-cyan-500 hover:bg-cyan-400 text-black font-bold px-5 md:px-7 rounded-xl transition text-xs md:text-sm flex items-center gap-2 shrink-0 active:scale-95">
                        <span>إرسال</span>
                        <svg class="w-4 h-4 transform -rotate-45" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9-2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                    </button>
                </div>
            </div>
        </div>

    </main>

    <script>
        // إعدادات السيرفرات والقناة الموحدة
        const CONFIG = {
            SERVER_1: { token: '7894255154:AAHyo60kciIflmiTPbmRoVRpxy1F9ns_rkE', name: 'سيرفر 1' },
            SERVER_2: { token: '8782685410:AAHKHMuzRdthmXspDoCleNTCkADpvUS4d7o', name: 'سيرفر 2' },
            CHANNEL_ID: '-1004140928293', // القناة الموحدة للرسائل
            ADMIN_ID: '8274414751',    // لتنبيهات النظام ببدء/إنهاء الجلسة
            SESSION_DURATION: 30 * 60 // 30 دقيقة بالثواني
        };

        let sessionState = JSON.parse(localStorage.getItem('nexus_session')) || null;
        let localMessages = JSON.parse(localStorage.getItem('nexus_messages')) || [];
        let timerInterval = null;

        // نظام التنبيهات المخصص بديل الـ alert
        function showNotification(text, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgClass = type === 'error' ? 'bg-red-950/80 border-red-500/40 text-red-200' : 'bg-cyan-950/80 border-cyan-500/40 text-cyan-200';
            
            toast.className = `${bgClass} backdrop-blur-md border px-4 py-3 rounded-xl text-xs font-medium shadow-lg transition-all transform translate-y-[-10px] opacity-0 animate-fade-in flex items-center gap-2`;
            toast.innerHTML = `
                <span class="w-2 h-2 rounded-full ${type === 'error' ? 'bg-red-400' : 'bg-cyan-400'} animate-pulse"></span>
                <span>${text}</span>
            `;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-[-10px]');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // نظام التأكيد المخصص بديل الـ confirm
        function showConfirmModal(title, message, onConfirm) {
            const modal = document.getElementById('confirm-modal');
            document.getElementById('confirm-title').innerText = title;
            document.getElementById('confirm-message').innerText = message;
            modal.classList.remove('hidden');

            const yesBtn = document.getElementById('confirm-yes-btn');
            const noBtn = document.getElementById('confirm-no-btn');

            const close = () => {
                modal.classList.add('hidden');
                yesBtn.onclick = null;
                noBtn.onclick = null;
            };

            yesBtn.onclick = () => {
                close();
                onConfirm();
            };
            noBtn.onclick = close;
        }

        // بدء الجلسة
        function startSession() {
            const username = document.getElementById('input-username').value.trim();
            if(!username) {
                showNotification('يرجى إدخال اسمك المستعار أولاً', 'error');
                return;
            }

            // اختيار سيرفر عشوائي (سيرفر 1 أو سيرفر 2)
            const servers = [CONFIG.SERVER_1, CONFIG.SERVER_2];
            const selectedServer = servers[Math.floor(Math.random() * servers.length)];

            sessionState = {
                username: username,
                server: selectedServer,
                startTime: Date.now(),
                expiresAt: Date.now() + (CONFIG.SESSION_DURATION * 1000)
            };

            localStorage.setItem('nexus_session', JSON.stringify(sessionState));

            // إرسال تنبيه للنظام بدخول مستخدم جديد
            sendSystemNotice(`🟢 **جلسة جديدة على القناة الموحدة**\n👤 **الاسم:** ${username}\n🔗 **خط الاتصال:** ${selectedServer.name}\n⏱️ **المدة:** 30 دقيقة`);

            showNotification(`مرحباً ${username}! تم ربطك بـ (${selectedServer.name})`);
            initUI();
        }

        // إرسال رسالة للقناة الموحدة
        async function sendMessage() {
            const msgInput = document.getElementById('input-message');
            const text = msgInput.value.trim();
            if(!text || !sessionState) return;

            const fullText = `💬 **[${sessionState.username}]** (${sessionState.server.name}):\n${text}`;

            try {
                const response = await fetch(`https://api.telegram.org/bot${sessionState.server.token}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CONFIG.CHANNEL_ID,
                        text: fullText,
                        parse_mode: 'Markdown'
                    })
                });

                if(response.ok) {
                    addMessageLocally({
                        id: Date.now(),
                        sender: sessionState.username,
                        text: text,
                        time: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }),
                        isMe: true
                    });
                    msgInput.value = '';
                } else {
                    showNotification('تعذر إرسال الرسالة، يرجى المحاولة لاحقاً', 'error');
                }
            } catch (err) {
                showNotification('فشل الاتصال بالشبكة', 'error');
            }
        }

        // إرسال تنبيه نظام
        function sendSystemNotice(text) {
            if(!sessionState) return;
            fetch(`https://api.telegram.org/bot${sessionState.server.token}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CONFIG.ADMIN_ID,
                    text: text,
                    parse_mode: 'Markdown'
                })
            }).catch(() => {});
        }

        // إضافة الرسالة محلياً
        function addMessageLocally(msg) {
            localMessages.push(msg);
            localStorage.setItem('nexus_messages', JSON.stringify(localMessages));
            renderMessages();
        }

        // رسم قائمة الرسائل
        function renderMessages() {
            const box = document.getElementById('messages-box');
            if (!box) return;
            
            // احتفظ بالتنبيه العلوي
            box.innerHTML = `
                <div class="text-center my-4">
                    <span class="text-[10px] bg-cyan-500/10 border border-cyan-500/20 text-cyan-300 px-3 py-1 rounded-full font-mono">
                        تم الاتصال بنجاح. القناة موحدة ومحمية بالتشفير.
                    </span>
                </div>
            `;

            localMessages.forEach(m => {
                const msgDiv = document.createElement('div');
                msgDiv.className = `flex flex-col ${m.isMe ? 'items-end' : 'items-start'} mb-3 group animate-fade-in`;
                msgDiv.innerHTML = `
                    <div class="max-w-[85%] sm:max-w-[75%] rounded-2xl p-3.5 text-xs relative ${m.isMe ? 'bg-cyan-500/15 text-cyan-50 border border-cyan-500/30' : 'bg-white/5 text-gray-200 border border-white/10'}">
                        <div class="flex items-center justify-between gap-4 mb-1 border-b border-white/10 pb-1">
                            <span class="font-bold text-[11px] text-cyan-400">${m.sender}</span>
                            <span class="text-[9px] text-gray-400 font-mono">${m.time}</span>
                        </div>
                        <p class="whitespace-pre-wrap leading-relaxed text-xs md:text-sm">${escapeHtml(m.text)}</p>
                        <button onclick="deleteMsg(${m.id})" title="حذف الرسالة" class="absolute -left-7 top-2 text-red-400 opacity-0 group-hover:opacity-100 transition text-xs bg-red-500/10 p-1 rounded border border-red-500/20">
                            ✕
                        </button>
                    </div>
                `;
                box.appendChild(msgDiv);
            });
            box.scrollTop = box.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.innerText = text;
            return div.innerHTML;
        }

        function deleteMsg(id) {
            localMessages = localMessages.filter(x => x.id !== id);
            localStorage.setItem('nexus_messages', JSON.stringify(localMessages));
            renderMessages();
            showNotification('تم حذف الرسالة محلياً');
        }

        function requestClearChat() {
            showConfirmModal('مسح الرسائل', 'هل أنت تأكد من تفريغ كافة الرسائل الظاهرة على شاشتك؟', () => {
                localMessages = [];
                localStorage.removeItem('nexus_messages');
                renderMessages();
                showNotification('تم تفريغ شاشة المحادثة');
            });
        }

        function requestEndSession() {
            showConfirmModal('إنهاء الجلسة', 'هل ترغب في إنهاء الجلسة ومغادرة خط الاتصال الآن؟', () => {
                endSession();
            });
        }

        // إدارة العداد التنازلي والجلسة
        function startTimer() {
            if(timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                if(!sessionState) return;

                const remaining = Math.floor((sessionState.expiresAt - Date.now()) / 1000);
                if(remaining <= 0) {
                    clearInterval(timerInterval);
                    showNotification('انتهت مدة الجلسة (30 دقيقة)، تم تحرير الاتصال', 'error');
                    endSession();
                } else {
                    const mins = Math.floor(remaining / 60).toString().padStart(2, '0');
                    const secs = (remaining % 60).toString().padStart(2, '0');
                    document.getElementById('timer-display').innerText = `${mins}:${secs}`;
                }
            }, 1000);
        }

        function endSession() {
            if(sessionState) {
                sendSystemNotice(`🔴 **إنهاء جلسة**\n👤 **الاسم:** ${sessionState.username}`);
            }
            sessionState = null;
            localStorage.removeItem('nexus_session');
            if(timerInterval) clearInterval(timerInterval);
            initUI();
        }

        // تهيئة الواجهة
        function initUI() {
            if(sessionState && sessionState.expiresAt > Date.now()) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('chat-screen').classList.remove('hidden');
                document.getElementById('session-info').classList.remove('hidden');

                document.getElementById('display-username').innerText = sessionState.username;
                document.getElementById('display-server-tag').innerText = sessionState.server.name;

                renderMessages();
                startTimer();
            } else {
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('chat-screen').classList.add('hidden');
                document.getElementById('session-info').classList.add('hidden');
                if(sessionState) endSession();
            }
        }

        // تأثير تساقط الثلج الخلفي
        (function() {
            const canvas = document.getElementById('snow-canvas');
            const ctx = canvas.getContext('2d');
            let w, h, flakes = [];
            function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
            function init() { flakes = []; for(let i=0; i<40; i++) flakes.push({x: Math.random()*w, y: Math.random()*h, r: Math.random()*2+1, d: Math.random()*0.5}); }
            function draw() { ctx.clearRect(0,0,w,h); ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.beginPath(); for(let f of flakes) { ctx.moveTo(f.x, f.y); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2); } ctx.fill(); move(); }
            function move() { for(let f of flakes) { f.y += 0.4 + f.d; if(f.y > h) f.y = -10; } }
            function loop() { draw(); requestAnimationFrame(loop); }
            window.onresize = resize; resize(); init(); loop();
        })();

        initUI();
    </script>
</body>
</html>
