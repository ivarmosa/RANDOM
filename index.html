<!DOCTYPE html>
<html lang="ar" dir="rtl" id="main-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusChat | منصة المراسلة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #020202; color: white; margin: 0; overflow-x: hidden; min-height: 100vh; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-card { background: rgba(18, 18, 20, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .neon-cyan { color: #00ffff; text-shadow: 0 0 10px rgba(0, 255, 255, 0.4); }
        .neon-glow { box-shadow: 0 0 20px rgba(0, 255, 255, 0.15); }
        
        input, textarea, select { 
            background: rgba(255, 255, 255, 0.04) !important; 
            border: 1px solid rgba(255, 255, 255, 0.1) !important; 
            color: white !important; 
            outline: none; 
            transition: all 0.3s ease;
        }
        input:focus, textarea:focus { border-color: #00ffff !important; box-shadow: 0 0 12px rgba(0, 255, 255, 0.2); }
        
        #snow-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(0, 255, 255, 0.3); border-radius: 10px; }
        
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 20px;
            border-radius: 12px;
            background: rgba(18, 18, 20, 0.9);
            border: 1px solid rgba(0, 255, 255, 0.3);
            color: white;
            font-size: 13px;
            z-index: 100;
            transition: all 0.3s ease;
            transform: translateY(100px);
            opacity: 0;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen relative">

    <canvas id="snow-canvas"></canvas>

    <div id="toast" class="toast"></div>

    <nav class="glass sticky top-0 p-4 z-50 flex justify-between items-center px-6">
        <div class="flex items-center gap-3">
            <h1 class="text-2xl font-black tracking-wider neon-cyan">NexusChat</h1>
            <span class="text-[10px] bg-cyan-500/10 text-cyan-400 px-2 py-0.5 rounded border border-cyan-500/20 hidden sm:inline-block">مشفر ومباشر</span>
        </div>
        
        <div id="session-info" class="hidden flex items-center gap-4">
            <div class="flex items-center gap-2 bg-black/40 px-3 py-1.5 rounded-xl border border-white/10">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span id="display-username" class="text-xs font-bold text-gray-200"></span>
                <span id="display-server-tag" class="text-[10px] bg-cyan-500/20 text-cyan-300 px-2 py-0.5 rounded-md font-mono"></span>
            </div>
            
            <div class="flex items-center gap-2 bg-red-500/10 border border-red-500/20 px-3 py-1.5 rounded-xl">
                <span class="text-[11px] text-red-400 font-medium">الوقت:</span>
                <span id="timer-display" class="font-mono text-xs font-bold text-red-400">30:00</span>
            </div>

            <button onclick="endSession()" class="text-xs text-red-400 hover:text-red-300 transition bg-red-500/10 px-3 py-1.5 rounded-xl border border-red-500/20">
                إنهاء
            </button>
        </div>
    </nav>

    <main class="flex-1 container mx-auto px-4 py-8 max-w-4xl relative z-10 flex flex-col justify-center">

        <div id="login-screen" class="glass-card p-8 rounded-3xl max-w-md mx-auto w-full text-center neon-glow">
            <div class="w-16 h-16 bg-cyan-500/10 border border-cyan-400/30 rounded-2xl flex items-center justify-center mx-auto mb-4 text-cyan-400">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457-.39-2.823-1.07-4"></path></svg>
            </div>
            <h2 class="text-2xl font-bold mb-2">الدخول للمحطة</h2>
            <p class="text-xs text-gray-400 mb-6">سجل اسمك ليتم ربطك بسيرفر اتصال متاح تلقائياً لمدة 30 دقيقة</p>

            <div class="space-y-4">
                <input type="text" id="input-username" placeholder="اكتب اسم المستعار..." class="w-full p-4 rounded-xl text-center font-bold text-sm">
                <button onclick="startSession()" class="w-full bg-cyan-500 hover:bg-cyan-400 text-black font-bold py-4 rounded-xl transition shadow-lg shadow-cyan-500/20">
                    دخول تلقائي للمحطة
                </button>
            </div>
        </div>

        <div id="chat-screen" class="hidden glass-card rounded-3xl p-6 flex flex-col h-[75vh]">
            <div class="flex justify-between items-center pb-4 border-b border-white/10">
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-ping"></span>
                    <span class="text-xs font-bold text-cyan-300">القناة الموحدة للمراسلة</span>
                </div>
                <button onclick="clearLocalChat()" class="text-xs text-gray-400 hover:text-red-400 transition bg-white/5 px-3 py-1.5 rounded-lg border border-white/10">
                    تفريغ الشاشة
                </button>
            </div>

            <div id="messages-box" class="flex-1 overflow-y-auto custom-scroll my-4 space-y-3 p-2">
                <div class="text-center my-6">
                    <span class="text-[10px] bg-white/5 border border-white/10 text-cyan-400 px-4 py-1.5 rounded-full">
                        تم الاتصال بنجاح. القناة موحدة ومحمية بالتشفير.
                    </span>
                </div>
            </div>

            <div class="pt-2">
                <div class="flex gap-2">
                    <input type="text" id="input-message" onkeydown="if(event.key==='Enter') sendMessage()" placeholder="اكتب رسالتك هنا..." class="flex-1 p-3.5 rounded-xl text-xs">
                    <button onclick="sendMessage()" class="bg-cyan-500 hover:bg-cyan-400 text-black font-bold px-6 rounded-xl transition text-xs flex items-center gap-2">
                        <span>إرسال</span>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9-2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                    </button>
                </div>
            </div>
        </div>

    </main>

    <script>
        const CONFIG = {
            SERVER_1: { token: '7894255154:AAHyo60kciIflmiTPbmRoVRpxy1F9ns_rkE', name: 'سيرفر 1' },
            SERVER_2: { token: '8782685410:AAHKHMuzRdthmXspDoCleNTCkADpvUS4d7o', name: 'سيرفر 2' },
            ADMIN_ID: '8274414751',
            CHANNEL_ID: '-1004140928293',
            SESSION_DURATION: 30 * 60
        };

        let sessionState = JSON.parse(localStorage.getItem('nexus_session')) || null;
        let localMessages = JSON.parse(localStorage.getItem('nexus_messages')) || [];
        let lastUpdateId = parseInt(localStorage.getItem('nexus_last_update_id')) || 0;
        let timerInterval = null;
        let pollInterval = null;

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function startSession() {
            const username = document.getElementById('input-username').value.trim();
            if(!username) return showToast('يرجى إدخال اسمك أولاً');

            const servers = [CONFIG.SERVER_1, CONFIG.SERVER_2];
            const selectedServer = servers[Math.floor(Math.random() * servers.length)];

            sessionState = {
                username: username,
                server: selectedServer,
                startTime: Date.now(),
                expiresAt: Date.now() + (CONFIG.SESSION_DURATION * 1000)
            };

            localStorage.setItem('nexus_session', JSON.stringify(sessionState));

            sendTelegramNotice(`🟢 **دخول جديد**\n👤 **الاسم:** ${username}\n🔗 **السيرفر:** ${selectedServer.name}`);

            initUI();
            showToast('تم تسجيل الدخول بنجاح!');
        }

        async function sendMessage() {
            const msgInput = document.getElementById('input-message');
            const text = msgInput.value.trim();
            if(!text || !sessionState) return;

            const fullText = `💬 **[${sessionState.username}]**:\n${text}`;

            try {
                const response = await fetch(`https://api.telegram.org/bot${sessionState.server.token}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CONFIG.CHANNEL_ID,
                        text: fullText,
                        parse_mode: 'Markdown'
                    })
                });

                if(response.ok) {
                    addMessageLocally({
                        id: Date.now(),
                        sender: sessionState.username,
                        text: text,
                        time: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }),
                        isMe: true
                    });
                    msgInput.value = '';
                } else {
                    showToast('حدث خطأ أثناء الإرسال');
                }
            } catch (err) {
                showToast('فشل الاتصال بالشبكة');
            }
        }

        function sendTelegramNotice(text) {
            if(!sessionState) return;
            fetch(`https://api.telegram.org/bot${sessionState.server.token}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CONFIG.ADMIN_ID,
                    text: text,
                    parse_mode: 'Markdown'
                })
            }).catch(() => {});
        }

        function addMessageLocally(msg) {
            if(!localMessages.some(m => m.id === msg.id || (m.text === msg.text && m.sender === msg.sender && Math.abs(m.id - msg.id) < 5000))) {
                localMessages.push(msg);
                localStorage.setItem('nexus_messages', JSON.stringify(localMessages));
                renderMessages();
            }
        }

        function renderMessages() {
            const box = document.getElementById('messages-box');
            if (!box) return;
            box.innerHTML = '';

            localMessages.forEach(m => {
                const msgDiv = document.createElement('div');
                msgDiv.className = `flex flex-col ${m.isMe ? 'items-end' : 'items-start'} mb-2 group`;
                msgDiv.innerHTML = `
                    <div class="max-w-[80%] rounded-2xl p-3 text-xs relative ${m.isMe ? 'bg-cyan-500/20 text-cyan-100 border border-cyan-500/30' : 'bg-white/10 text-gray-200 border border-white/10'}">
                        <div class="flex items-center justify-between gap-4 mb-1 border-b border-white/10 pb-1">
                            <span class="font-bold text-[10px] text-cyan-400">${m.sender}</span>
                            <span class="text-[9px] text-gray-400">${m.time}</span>
                        </div>
                        <p class="whitespace-pre-wrap">${m.text}</p>
                        <button onclick="deleteMsg(${m.id})" class="absolute -left-6 top-2 text-red-400 opacity-0 group-hover:opacity-100 transition text-[10px]">✕</button>
                    </div>
                `;
                box.appendChild(msgDiv);
            });
            box.scrollTop = box.scrollHeight;
        }

        function deleteMsg(id) {
            localMessages = localMessages.filter(x => x.id !== id);
            localStorage.setItem('nexus_messages', JSON.stringify(localMessages));
            renderMessages();
            showToast('تم حذف الرسالة من الشاشة');
        }

        function clearLocalChat() {
            localMessages = [];
            localStorage.removeItem('nexus_messages');
            renderMessages();
            showToast('تم تفريغ الشاشة');
        }

        async function fetchUpdates() {
            if(!sessionState) return;
            
            try {
                const url = `https://api.telegram.org/bot${sessionState.server.token}/getUpdates?offset=${lastUpdateId + 1}`;
                const res = await fetch(url);
                const data = await res.json();

                if(data.ok && data.result.length > 0) {
                    data.result.forEach(update => {
                        lastUpdateId = update.update_id;
                        localStorage.setItem('nexus_last_update_id', lastUpdateId);

                        const msgObj = update.channel_post || update.message;
                        if(msgObj && msgObj.text) {
                            const rawText = msgObj.text;
                            const match = rawText.match(/💬 \*\*\[(.*?)\]\*\*:\n([\s\S]*)/);
                            if(match) {
                                const senderName = match[1];
                                const msgContent = match[2];

                                const isMe = sessionState && senderName === sessionState.username;
                                addMessageLocally({
                                    id: msgObj.message_id || Date.now(),
                                    sender: senderName,
                                    text: msgContent,
                                    time: new Date(msgObj.date * 1000).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }),
                                    isMe: isMe
                                });
                            }
                        }
                    });
                }
            } catch(e) {}
        }

        function startTimer() {
            if(timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                if(!sessionState) return;

                const remaining = Math.floor((sessionState.expiresAt - Date.now()) / 1000);
                if(remaining <= 0) {
                    clearInterval(timerInterval);
                    showToast('انتهت مدة الجلسة (30 دقيقة)');
                    endSession();
                } else {
                    const mins = Math.floor(remaining / 60).toString().padStart(2, '0');
                    const secs = (remaining % 60).toString().padStart(2, '0');
                    document.getElementById('timer-display').innerText = `${mins}:${secs}`;
                }
            }, 1000);
        }

        function endSession() {
            if(sessionState) {
                sendTelegramNotice(`🔴 **إنهاء جلسة**\n👤 **الاسم:** ${sessionState.username}`);
            }
            sessionState = null;
            localStorage.removeItem('nexus_session');
            if(timerInterval) clearInterval(timerInterval);
            if(pollInterval) clearInterval(pollInterval);
            initUI();
        }

        function initUI() {
            if(sessionState && sessionState.expiresAt > Date.now()) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('chat-screen').classList.remove('hidden');
                document.getElementById('session-info').classList.remove('hidden');

                document.getElementById('display-username').innerText = sessionState.username;
                document.getElementById('display-server-tag').innerText = sessionState.server.name;

                renderMessages();
                startTimer();

                if(pollInterval) clearInterval(pollInterval);
                pollInterval = setInterval(fetchUpdates, 2000);
            } else {
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('chat-screen').classList.add('hidden');
                document.getElementById('session-info').classList.add('hidden');
                if(sessionState) endSession();
            }
        }

        (function() {
            const canvas = document.getElementById('snow-canvas');
            const ctx = canvas.getContext('2d');
            let w, h, flakes = [];
            function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
            function init() { flakes = []; for(let i=0; i<45; i++) flakes.push({x: Math.random()*w, y: Math.random()*h, r: Math.random()*2+1, d: Math.random()*0.5}); }
            function draw() { ctx.clearRect(0,0,w,h); ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.beginPath(); for(let f of flakes) { ctx.moveTo(f.x, f.y); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2); } ctx.fill(); move(); }
            function move() { for(let f of flakes) { f.y += 0.5 + f.d; if(f.y > h) f.y = -10; } }
            function loop() { draw(); requestAnimationFrame(loop); }
            window.onresize = resize; resize(); init(); loop();
        })();

        initUI();
    </script>
</body>
</html>
